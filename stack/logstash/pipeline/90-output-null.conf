output {
  # Counting sink used by the scale-out scenario. It accepts and counts events
  # as fast as they arrive, which removes Elasticsearch from the measurement so
  # that what is left is consumer scaling alone.
  http {
    url => "${BENCH_SINK:http://sink:8200/bulk}"
    http_method => "post"
    format => "json_batch"
    pool_max => 50
    retry_failed => false
  }
}
