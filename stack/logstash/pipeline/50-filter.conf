filter {
  # Every arm runs this identical block. Whatever the processing costs, all
  # three pay it, so differences in the results come from the transport rather
  # than from the work done on each event.

  # Fields the transport itself adds (HTTP headers, request metadata). The
  # generator's own fields are deliberately flat -- host_name, http_method and
  # so on -- so nothing here can collide with payload data.
  mutate {
    remove_field => ["@version", "event", "host", "url", "http", "headers", "user_agent", "tags"]
  }

  # Representative enrichment: normalise the textual level to a syslog severity.
  translate {
    source => "log_level"
    target => "severity_code"
    dictionary => {
      "debug"    => 7
      "info"     => 6
      "notice"   => 5
      "warn"     => 4
      "error"    => 3
      "critical" => 2
    }
    fallback => 6
  }

  # Logical deduplication, enabled only by scenario 05: a content fingerprint
  # becomes the document _id, so a redelivered event overwrites itself instead
  # of producing a second document.
  if "${LS_DEDUP:false}" == "true" {
    fingerprint {
      source => ["gen_id", "seq"]
      target => "[@metadata][fingerprint]"
      method => "MURMUR3_128"
      concatenate_sources => true
    }
  }
}
