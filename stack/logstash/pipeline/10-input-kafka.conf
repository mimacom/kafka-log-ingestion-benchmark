input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP}"
    topics => ["${KAFKA_TOPIC}"]
    group_id => "${KAFKA_GROUP:logstash}"
    client_id => "logstash-bench"

    # One Kafka consumer per thread, all in the same group: this is the same
    # mechanism as running N Logstash instances, which is what scenario 04
    # varies (1 -> 2 -> 4) against a 6-partition topic.
    consumer_threads => "${CONSUMER_THREADS:4}"

    auto_offset_reset => "earliest"
    # Offsets commit only after the batch is handed to the pipeline, so a
    # consumer crash replays rather than drops.
    enable_auto_commit => true
    auto_commit_interval_ms => "1000"

    # Favour latency over batching efficiency: return as soon as data exists.
    fetch_min_bytes => "1"
    max_poll_records => "500"

    codec => json
    decorate_events => "none"
  }
}
