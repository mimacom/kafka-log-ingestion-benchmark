output {
  if "${LS_DEDUP:false}" == "true" {
    elasticsearch {
      hosts => ["${BENCH_ES}"]
      index => "${BENCH_INDEX}"
      document_id => "%{[@metadata][fingerprint]}"
      action => "index"
      manage_template => false
      # Retries are what turn an Elasticsearch outage into backpressure rather
      # than into loss. Left at the plugin defaults for every arm.
    }
  } else {
    elasticsearch {
      hosts => ["${BENCH_ES}"]
      index => "${BENCH_INDEX}"
      action => "index"
      manage_template => false
    }
  }
}
