input {
  http {
    host => "0.0.0.0"
    port => 8080

    # Newline-delimited JSON, one event per line: the same payload bytes the
    # Kafka arm produces, so the two arms are comparable on the wire.
    codec => json_lines
    additional_codecs => {}

    threads => 8
    # When the queue is full this bound is what makes the input reject rather
    # than buffer without limit. A rejected batch is the sender's problem,
    # which is exactly the situation being measured.
    max_pending_requests => 200

    response_headers => { "Content-Type" => "application/json" }
  }
}
